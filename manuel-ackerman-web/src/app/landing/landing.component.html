@if (isLoading()) {
  <div class="state-panel state-panel--loading" role="status" aria-live="polite">
    <p>Cargando...</p>
  </div>
} @else {
  @if (errorView(); as err) {
    <div class="state-panel state-panel--error" role="alert">
      <p>{{ err.message }}</p>
      <button type="button" class="state-panel__retry" (click)="retry()">Reintentar</button>
    </div>
  } @else {
    @if (readyView(); as rv) {
      <div class="video-wrap">
        <video
          id="bg-video"
          [autoplay]="true"
          [muted]="true"
          loop
          playsinline
          preload="auto"
        >
          <source src="assets/video/coming-soon.webm" type="video/webm" />
          <source src="assets/video/coming-soon.mp4" type="video/mp4" />
          {{ rv.texts.videoUnsupported }}
        </video>

        <div class="overlay" [style.transform]="parallaxTransform">
          <h1 class="title">{{ rv.texts.title }}</h1>
          <p class="subtitle">{{ rv.texts.subtitle }}</p>
          <button class="instagram-btn" (click)="onInstagramClick()">
            {{ rv.texts.button }}
          </button>
        </div>
        <app-footer></app-footer>
      </div>
    }
  }
}
